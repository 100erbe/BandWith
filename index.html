<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#E5E3E0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://use.typekit.net/mzr4hzv.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&display=swap">
    <title>BandWith</title>
    <script>
      // ═══ Dark-mode flash prevention — runs before any paint ═══
      (function() {
        var stored = null;
        try { stored = localStorage.getItem('bandwith-theme-mode'); } catch(e) {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#313131');
        }
        // Detect Android or mobile native container for safe margins
        if (/Android/i.test(navigator.userAgent) || window.Capacitor?.getPlatform?.() === 'android') {
          document.documentElement.classList.add('is-android');
          document.documentElement.setAttribute('data-platform', 'android');
        }
      })();
    </script>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background: var(--background, #E6E5E1);
      }
      ::-webkit-scrollbar { display: none; }
      * { -ms-overflow-style: none; scrollbar-width: none; }
      :root { color-scheme: light; }
      :root.dark { color-scheme: dark; }
      /* No -webkit-overflow-scrolling here: iOS scrolls with momentum by
         default, and that property turns #root into its own stacking
         context, so layers portaled to <body> (quotes, pricing, sheets)
         covered the iPhone Duo rail and its Back / Close. */
      #root {
        height: 100%; overflow-y: scroll; overflow-x: hidden;
        overscroll-behavior-y: contain;
      }
      /* 16px stops iOS zooming on focus. The radius reset sits in the base
         layer so Tailwind's rounded-* utilities can still override it. */
      input, textarea, select { font-size: 16px; }
      @layer base { input, textarea, select { border-radius: 0; } }
      input:-webkit-autofill, input:-webkit-autofill:hover,
      input:-webkit-autofill:focus, input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #E6E5E1 inset !important;
        -webkit-text-fill-color: #050505 !important;
        caret-color: #050505 !important;
        transition: background-color 5000s ease-in-out 0s;
      }
      input:focus, textarea:focus, select:focus {
        outline: none; -webkit-tap-highlight-color: transparent;
      }
      /* Launch splash (splash/ → public/splash). Native only: the static iOS/Android
         launch screen hides, then this overlay plays the rendered animation on top
         of the app, which keeps booting underneath. Tap to skip; ≤ ~3 s. */
      #bw-splash {
        position: fixed; inset: 0; z-index: 99999; display: none;
        background: #050505; overflow: hidden;
        transition: opacity 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #bw-splash.bw-out { opacity: 0; pointer-events: none; }
      #bw-splash > svg {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      }
      #bw-splash > video, #bw-splash > img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; opacity: 0;
      }
      #bw-splash > .on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="bw-splash" aria-hidden="true">
      <!-- Frame 0 of the animation (the pictogram), drawn before the video decodes. -->
      <svg viewBox="0 0 286 286" fill="#D5FB46"><rect width="88" height="88" rx="30"/><rect y="99" width="88" height="88" rx="30"/><rect y="198" width="88" height="88" rx="30"/><rect x="99" y="99" width="88" height="187" rx="30"/><rect x="198" width="88" height="88" rx="30"/><rect x="198" y="99" width="88" height="88" rx="30"/><rect x="198" y="198" width="88" height="88" rx="30"/></svg>
      <img alt="" decoding="async">
      <video muted playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var el = document.getElementById('bw-splash');
        if (!el) return;
        var cap = window.Capacitor;
        var isNative = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
        var q = location.search;
        var forced = /[?&]splash=1(&|$)/.test(q); // web preview: /?splash=1
        var authLink = /access_token=|type=recovery|type=signup/.test(location.hash) ||
          /[?&]code=/.test(q) || /\/auth\/callback$/.test(location.pathname);
        if ((!isNative && !forced) || authLink) { el.parentNode.removeChild(el); return; }
        el.style.display = 'block';

        // Phone canvas (1290×2796) or the iPhone Duo cover display (466×678 pt @3x).
        var W = window.innerWidth, H = window.innerHeight;
        var v = W / H > 0.56
          ? { w: 1398, h: 2034, mark: 297.4, name: 'bandwith-splash-cover' }
          : { w: 1290, h: 2796, mark: 307, name: 'bandwith-splash' };
        // Same maths as object-fit: cover, so the static mark sits exactly on frame 0.
        var k = Math.max(W / v.w, H / v.h);
        var mark = el.querySelector('svg');
        mark.style.width = mark.style.height = v.mark * k + 'px';

        var done = false;
        function finish() {
          if (done) return;
          done = true;
          el.classList.add('bw-out');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 360);
        }
        el.addEventListener('pointerdown', finish); // tap to skip

        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) {
          // Static fallback: the final lockup, briefly.
          var img = el.querySelector('img');
          img.onload = function () { img.className = 'on'; };
          img.src = '/splash/' + v.name + '-lockup.webp';
          setTimeout(finish, 900);
          return;
        }

        var vid = el.querySelector('video');
        // Never hold the app back: if playback hasn't started within 1.5 s, skip it.
        var cap = setTimeout(finish, 1500);
        function show() { vid.className = 'on'; }
        vid.addEventListener('playing', function () {
          // Reveal on the first decoded frame (no black flash); the timeout covers
          // WebViews that never call back.
          if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(show);
          setTimeout(show, 120);
          // Once it plays: ~3 s of animation, then out even if 'ended' never fires.
          clearTimeout(cap);
          cap = setTimeout(finish, 3200);
        });
        vid.addEventListener('ended', finish);
        vid.addEventListener('error', finish);
        vid.src = '/splash/' + v.name + '.mp4';
        var p = vid.play();
        if (p && p.catch) p.catch(finish); // autoplay refused → straight to the app
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
